<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Title & description ── -->
    <title>TrackAll — All your media in one place</title>
    <meta name="description" content="Track anime, manga, movies, series, games, books and comics in a unified library. Rate, share with friends and discover new media." />
    <meta name="keywords" content="trackall, anime tracker, manga tracker, movies, series, games, library, myanimelist, letterboxd" />
    <meta name="author" content="TrackAll" />

    <!-- ── OG tags (Discord, Facebook, WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trackall-green.vercel.app" />
    <meta property="og:title" content="TrackAll — All your media in one place" />
    <meta property="og:description" content="Track anime, manga, movies, series, games, books and comics in a unified library. Rate it, share with friends, discover new media." />
    <meta property="og:image" content="https://trackall-green.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="TrackAll" />

    <!-- ── Twitter/X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trackall-green.vercel.app" />
    <meta name="twitter:title" content="TrackAll — All your media in one place" />
    <meta name="twitter:description" content="Track anime, manga, movies, series, games, books and comics in a unified library. Rate it, share with friends, discover new media." />
    <meta name="twitter:image" content="https://trackall-green.vercel.app/og-image.png" />

    <!-- ── PWA ── -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrackAll" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Preload font ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Fundo escuro desde o 1.º frame (evita barras brancas durante o arranque) -->
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0d1117; }
      html { color-scheme: dark; }
    </style>
    <!-- Cor de fundo do teu tema desde o 1.º frame (lê a cópia guardada pela app; sem ela fica o #0d1117 acima) -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("trackall_boot_theme") || "null");
        if (t) {
          var c = (t.bgSeparateDevices && t.bgColorMobile && window.innerWidth < 768) ? t.bgColorMobile : t.bgColor;
          if (/^#[0-9a-f]{6}$/i.test(c || "")) {
            var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
            var light = (0.299 * r + 0.587 * g + 0.114 * b) > 160;
            var st = document.createElement("style");
            st.textContent = "html,body,#root{background:" + c + "!important}html{color-scheme:" + (light ? "light" : "dark") + "}";
            document.head.appendChild(st);
            var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", c);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
